name: Publish site update

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Check the connection or publish the authorised update
        type: choice
        options: [check, publish]
        default: publish

concurrency:
  group: hospitality121-site-update-2026-10
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  linkedin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Publish the authorised website update
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORG_URN: ${{ secrets.LINKEDIN_ORG_URN }}
          LINKEDIN_ORGANIZATION_ID: ${{ vars.LINKEDIN_ORGANIZATION_ID }}
          SITE_UPDATE_MODE: ${{ inputs.mode }}
        run: node scripts/publish-site-update.mjs
      - name: Save publication receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-update-publication-receipt
          path: publication-receipt.json
          if-no-files-found: ignore
