name: Cloud editorial publisher
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Verified articles to attempt in this one-time manual release'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '4'
permissions:
  contents: write
concurrency:
  group: hospitality121-cloud-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      MANUAL_BATCH_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.batch_size || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Find and verify one fresh article, or recover an unfinished deployment
        id: editorial
        shell: bash
        run: |
          changed=false
          batch_limit="${MANUAL_BATCH_LIMIT:-1}"
          batch_mode=false
          if [[ "$batch_limit" -gt 1 ]]; then batch_mode=true; fi
          published_today=0
          editorial_status=checking
          for ((attempt = 1; attempt <= batch_limit; attempt++)); do
            attempt_output="$(mktemp)"
            if ! GITHUB_OUTPUT="$attempt_output" EDITORIAL_BATCH_MODE="$batch_mode" node scripts/cloud-editorial.mjs; then
              if [[ "$changed" == true ]]; then
                echo '::warning::A later candidate attempt failed; deploying the articles that already passed mandatory checks.'
                break
              fi
              exit 1
            fi
            published_today="$(grep '^publishedToday=' "$attempt_output" | tail -1 | cut -d= -f2)"
            editorial_status="$(grep '^status=' "$attempt_output" | tail -1 | cut -d= -f2)"
            if grep -q '^changed=true$' "$attempt_output"; then
              changed=true
            else
              break
            fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "publishedToday=$published_today" >> "$GITHUB_OUTPUT"
          echo "status=$editorial_status" >> "$GITHUB_OUTPUT"
      - name: Validate complete publication
        if: steps.editorial.outputs.changed == 'true'
        run: npm run verify
      - name: Commit only the new verified article, photograph and report
        if: steps.editorial.outputs.changed == 'true'
        run: |
          git config user.name 'Hospitality121 Cloud Publisher'
          git config user.email 'action@github.com'
          git add content/news public/images/content reports/hourly-editorial
          if ! git diff --cached --quiet; then
            git commit -m 'Publish source-checked hospitality coverage'
            git push origin HEAD:main
          fi
      - name: Install the deployment tool
        if: steps.editorial.outputs.changed == 'true'
        run: |
          npm install -g netlify-cli@26.0.2
          echo "NETLIFY_CLI_ROOT=$(npm root -g)/netlify-cli" >> "$GITHUB_ENV"
      - name: Deploy a preview, verify it and publish production
        if: steps.editorial.outputs.changed == 'true'
        run: |
          node scripts/deploy-static-site.mjs
          node scripts/publish-ready-site.mjs
          node scripts/verify-cloud-live.mjs
      - name: Save check and deployment receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-editorial-receipts
          path: |
            reports/hourly-editorial/*cloud.json
            reports/deployments/*original-articles.json
            reports/deployments/cloud-live-check.json
          retention-days: 14
      - name: Alert if the Vancouver editorial day ends below four articles
        if: github.event_name == 'schedule' && always()
        shell: bash
        run: |
          hour="$(TZ=America/Vancouver date +%H)"
          published="${{ steps.editorial.outputs.publishedToday }}"
          published="${published:-0}"
          added=0
          if [[ "${{ steps.editorial.outputs.changed }}" == 'true' ]]; then added=1; fi
          if [[ "$hour" -ge 20 && $((published + added)) -lt 4 ]]; then
            echo '::error::Fewer than four verified articles were published today. Inspect the cloud-editorial-receipts artifact for source, model, or photo failures.'
            exit 1
          fi
