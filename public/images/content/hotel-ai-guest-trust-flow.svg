<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1020" viewBox="0 0 960 1020"><title>From AI answer to a delivered hotel experience</title><rect width="960" height="1020" rx="24" fill="#faf8f3"/><text x="54" y="49" font-family="Arial" font-size="15" font-weight="700" letter-spacing="3" fill="#896114">HOSPITALITY121 / AN OPERATING MODEL</text><text x="54" y="97" font-family="Georgia" font-size="36" fill="#172735">From an answer to a delivered stay</text><g><rect x="54" y="150" width="852" height="124" rx="16" fill="#ffffff" stroke="#d8ceba"/><circle cx="105" cy="203" r="26" fill="#172735"/><text x="105" y="210" text-anchor="middle" font-family="Arial" font-size="20" fill="#e7c878">01</text><text x="154" y="178" font-family="Arial" font-size="14" font-weight="700" letter-spacing="2" fill="#896114">UNDERSTAND</text><text x="154" y="211" font-family="Georgia" font-size="27" fill="#172735">Identify the guest’s need</text><text x="154" y="244" font-family="Arial" font-size="20" fill="#475569">Keep context; ask rather than assume.</text></g><path d="M480 278v17m-6-6 6 6 6-6" fill="none" stroke="#aa8028" stroke-width="3"/><g><rect x="54" y="301" width="852" height="124" rx="16" fill="#f4f1e9" stroke="#d8ceba"/><circle cx="105" cy="354" r="26" fill="#172735"/><text x="105" y="361" text-anchor="middle" font-family="Arial" font-size="20" fill="#e7c878">02</text><text x="154" y="329" font-family="Arial" font-size="14" font-weight="700" letter-spacing="2" fill="#896114">VERIFY</text><text x="154" y="362" font-family="Georgia" font-size="27" fill="#172735">Check current hotel facts</text><text x="154" y="395" font-family="Arial" font-size="20" fill="#475569">Room readiness, availability and policy.</text></g><path d="M480 429v17m-6-6 6 6 6-6" fill="none" stroke="#aa8028" stroke-width="3"/><g><rect x="54" y="452" width="852" height="124" rx="16" fill="#ffffff" stroke="#d8ceba"/><circle cx="105" cy="505" r="26" fill="#172735"/><text x="105" y="512" text-anchor="middle" font-family="Arial" font-size="20" fill="#e7c878">03</text><text x="154" y="480" font-family="Arial" font-size="14" font-weight="700" letter-spacing="2" fill="#896114">ASSIGN</text><text x="154" y="513" font-family="Georgia" font-size="27" fill="#172735">Give the task an owner</text><text x="154" y="546" font-family="Arial" font-size="20" fill="#475569">Route to an authorised team or person.</text></g><path d="M480 580v17m-6-6 6 6 6-6" fill="none" stroke="#aa8028" stroke-width="3"/><g><rect x="54" y="603" width="852" height="124" rx="16" fill="#f4f1e9" stroke="#d8ceba"/><circle cx="105" cy="656" r="26" fill="#172735"/><text x="105" y="663" text-anchor="middle" font-family="Arial" font-size="20" fill="#e7c878">04</text><text x="154" y="631" font-family="Arial" font-size="14" font-weight="700" letter-spacing="2" fill="#896114">CONFIRM</text><text x="154" y="664" font-family="Georgia" font-size="27" fill="#172735">Close the delivery loop</text><text x="154" y="697" font-family="Arial" font-size="20" fill="#475569">Tell the guest what actually happened.</text></g><path d="M480 731v17m-6-6 6 6 6-6" fill="none" stroke="#aa8028" stroke-width="3"/><g><rect x="54" y="754" width="852" height="124" rx="16" fill="#ffffff" stroke="#d8ceba"/><circle cx="105" cy="807" r="26" fill="#172735"/><text x="105" y="814" text-anchor="middle" font-family="Arial" font-size="20" fill="#e7c878">05</text><text x="154" y="782" font-family="Arial" font-size="14" font-weight="700" letter-spacing="2" fill="#896114">LEARN</text><text x="154" y="815" font-family="Georgia" font-size="27" fill="#172735">Measure the guest outcome</text><text x="154" y="848" font-family="Arial" font-size="20" fill="#475569">Track completion, effort and recovery.</text></g><rect x="54" y="925" width="852" height="54" rx="12" fill="#172735"/><text x="480" y="959" text-anchor="middle" font-family="Arial" font-size="21" fill="#ffffff">Human handoff and accountability at every stage</text></svg>